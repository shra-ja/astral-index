[package]
name = "astral-index"
# A placeholder the Tauri CLI requires: builds receive the version from the release
# tags (decision 0030).
version = "0.0.0"
edition = "2024"
license = "MIT"
# An app, not a library: never published, so the third-party notices leave it out.
publish = false
# The real app; the mock debug binary is built only with `--features mock` (decision 0014).
default-run = "astral-index"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
tauri = { version = "=2.12.0", features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }
dirs = "=6.0.0"
tokio = { version = "=1.53.1", features = ["process", "io-util", "time", "rt"] }
tokio-util = { version = "=0.7.19", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-dialog = "=2.8.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Builds the mock debug binary; the library and the real app are unchanged.
mock = []

[lib]
path = "src/lib.rs"

[dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }
rusqlite = { version = "=0.40.2", features = ["hooks", "limits"] }
tokio = { version = "=1.53.1", features = ["test-util"] }
sha2 = "=0.10.9"


[[bin]]
name = "astral-index-mock"
path = "src/bin/astral-index-mock.rs"
required-features = ["mock"]
