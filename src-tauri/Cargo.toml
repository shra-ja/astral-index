[package]
name = "roll-tracker"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
tauri = { version = "=2.11.5", features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
dirs = "=6.0.0"
tokio = { version = "=1.53.1", features = ["process", "io-util", "time", "rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
rusqlite = { version = "=0.40.2", features = ["hooks", "limits"] }
tokio = { version = "=1.53.1", features = ["test-util"] }
