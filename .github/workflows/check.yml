name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a pull request's run; every run on main finishes, since
# only main saves the caches.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Linux jobs each run one part of `npm run check`; Windows, the first release's
# only OS (decision 0027), runs the Rust unit tests and builds and smoke-tests the
# release.
jobs:
  static:
    name: Format, lint, docs and Rust lints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          rust-cache: static
          save-npm-cache: true
      - name: Format, lint, docs, icons, versions, cargo fmt and clippy
        run: npm run check:static
      - name: Summarise the job
        if: always()
        env:
          CHECK_JOB: static
          CHECK_STATUS: ${{ job.status }}
        run: npm run ci:summary

  gates:
    name: Tests and 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          rust-cache: instrumented
          native-tests: true
      - name: Build, coverage, offline native tests and coverage gates
        run: npm run check:gates
      - name: Summarise the job
        if: always()
        env:
          CHECK_JOB: gates
          CHECK_STATUS: ${{ job.status }}
        run: npm run ci:summary
      - name: Save coverage reports and native screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-native-smoke
          path: |
            coverage/frontend/
            coverage/tooling/
            coverage/backend/
            coverage/backend-unit/
            test-results/
          if-no-files-found: error

  probes:
    name: Mutation probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          rust-cache: instrumented
          native-tests: true
      - name: Prove each gate fails when it should
        run: npm run check:probes
      - name: Summarise the job
        if: always()
        env:
          CHECK_JOB: probes
          CHECK_STATUS: ${{ job.status }}
        run: npm run ci:summary
      # A probe that stalls until the job's time limit counts as cancelled.
      - name: Save probe failure snapshots
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-failures
          path: test-results/probe-failures/
          if-no-files-found: ignore

  windows-tests:
    name: Windows unit tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # npm runs scripts through cmd.exe on Windows, which splits the quoted
      # arguments the package scripts use; Git Bash reads them as on Linux.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          rust-cache: windows-tests
      # The unit tests embed the built frontend.
      - name: Build the frontend
        run: npm run build --workspace src-ui
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      # The Linux static checks never compile the Windows-only code.
      - name: Rust lints for Windows
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

  windows-release:
    name: Windows release build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, to find the last release's version.
          fetch-depth: 0
      - uses: ./.github/actions/setup-windows
        with:
          rust-cache: windows-release
          save-npm-cache: true
      - name: Install the prebuilt notices generator
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2
      # No manifest declares a version: the build carries the last release's, or 0.0.0
      # before the first, and the commit it is named after, which About shows
      # (decision 0030).
      - name: Name the build
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "TAURI_CONFIG={\"version\":\"${tag#v}\"}" >> "$GITHUB_ENV"
          echo "ASTRAL_INDEX_BUILD=$COMMIT" >> "$GITHUB_ENV"
      - name: Build the release executable
        run: npm run tauri -- build --no-bundle
      # The UI is tested end to end on Linux; this checks the native side on Windows:
      # the window, its icon, the data folders and a clean exit (decision 0029).
      - name: Smoke-test the release executable
        run: npm run test:windows-smoke
      # Builds of pull requests from forks hold someone else's code, so only this
      # repository's own builds are kept. Each waits under an unverified name, and
      # expires in a day unless every check passes.
      - name: Keep the build until every check passes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-unverified-${{ github.event.pull_request.head.sha || github.sha }}
          path: src-tauri/target/release/astral-index.exe
          retention-days: 1
          if-no-files-found: error

  # A failed run's build is never published, but stays until it expires, so
  # re-running only the failed jobs can still publish it.
  publish:
    name: Publish the Windows build
    needs: [static, gates, probes, windows-tests, windows-release]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish the build that passed every check
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Named so it can't pass for a release: a development build, unsigned.
          name: astral-index-dev-build-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          pattern: windows-build-unverified-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          delete-merged: true
