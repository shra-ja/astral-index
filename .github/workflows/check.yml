name: Checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb webkit2gtk-driver xdotool dbus-x11 bubblewrap python3
      - name: Allow network namespaces for the CI test sandbox
        run: |
          sudo install -m 0755 /usr/bin/bwrap /usr/local/bin/bwrap
          sudo apparmor_parser -r .github/apparmor-bwrap
          bwrap --unshare-net --dev-bind / / --proc /proc true
      - uses: asdf-vm/actions/install@a7acd3c0f80eb138922a2da9514d1df22864eaca # v4
        with:
          asdf_version: 0.20.0
      - name: Cache npm downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm/_cacache
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'package-lock.json') }}
      - name: Point Cargo's home at the asdf toolchain
        # asdf keeps installed tools and registry sources here, not in ~/.cargo.
        run: echo "CARGO_HOME=$(asdf where rust)" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies and installed tools
        # v2.9.2 supports Cargo's new build-dir layout used by the pinned nightly.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-bin: true
          cache-workspace-crates: false
          # The action also keys on rustc, Cargo manifests/lockfiles and build flags.
          # Include the workflow so changes to pinned tool versions invalidate it.
          key: ubuntu-24.04-${{ hashFiles('.tool-versions', '.github/workflows/check.yml') }}
      - name: Install pinned coverage and native test tools
        run: |
          rustup component add rustfmt clippy llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install tauri-driver --version 2.0.6 --locked
          cargo install cargo-about --version 0.9.2 --locked --features cli
          asdf reshim
      - name: Install locked dependencies before network isolation
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Tests, offline native smoke test, coverage gates and lint
        run: npm run check
      - name: Build native desktop binary
        run: npm run tauri -- build --no-bundle
      - name: Save coverage reports and native screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-and-native-smoke
          path: |
            coverage/frontend/
            coverage/tooling/
            coverage/backend/
            coverage/backend-unit/
            test-results/
          if-no-files-found: error

  windows:
    # The first release ships for Windows only (decision 0027): its Rust unit tests
    # run there, and the release executable is built from the commit under test.
    name: Windows unit tests and release build
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # npm runs scripts through cmd.exe on Windows, which splits the quoted
      # arguments the package scripts use; Git Bash reads them as on Linux.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install the pinned Rust toolchain
        run: |
          toolchain=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - name: Cache Rust dependencies and installed tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-bin: true
          cache-workspace-crates: false
          key: windows-2025-${{ hashFiles('.tool-versions', '.github/workflows/check.yml') }}
      - name: Install the notices generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      # The unit tests embed the built frontend, which the release build makes.
      - name: Build the release executable
        run: npm run tauri -- build --no-bundle
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      # Builds of pull requests from forks hold someone else's code, so only this
      # repository's own builds are kept, named so none passes for a release.
      - name: Save the unsigned development build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astral-index-dev-build-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: src-tauri/target/release/astral-index.exe
          retention-days: 30
          if-no-files-found: error
