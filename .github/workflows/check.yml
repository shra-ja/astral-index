name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# The Linux jobs each run one part of `npm run check`; Windows, the first release's
# only OS (decision 0027), runs the Rust unit tests and builds the release.
jobs:
  static:
    name: Format, lint, docs and Rust lints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          rust-cache: static
          save-npm-cache: true
      - name: Format, lint, docs, icons, versions, cargo fmt and clippy
        run: npm run check:static

  gates:
    name: Tests and 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          rust-cache: instrumented
          native-tests: true
      - name: Build, coverage, offline native tests and coverage gates
        run: npm run check:gates
      - name: Save coverage reports and native screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-and-native-smoke
          path: |
            coverage/frontend/
            coverage/tooling/
            coverage/backend/
            coverage/backend-unit/
            test-results/
          if-no-files-found: error

  probes:
    name: Mutation probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASDF_RUST_PROFILE: minimal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        with:
          rust-cache: instrumented
          native-tests: true
      - name: Prove each gate fails when it should
        run: npm run check:probes
      - name: Save probe failure snapshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-failures
          path: test-results/probe-failures/
          if-no-files-found: ignore

  windows-tests:
    name: Windows unit tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # npm runs scripts through cmd.exe on Windows, which splits the quoted
      # arguments the package scripts use; Git Bash reads them as on Linux.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          rust-cache: windows-tests
      # The unit tests embed the built frontend.
      - name: Build the frontend
        run: npm run build --workspace src-ui
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  windows-release:
    name: Windows release build
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          rust-cache: windows-release
          save-npm-cache: true
      - name: Install the prebuilt notices generator
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2
      - name: Build the release executable
        run: npm run tauri -- build --no-bundle
      # Builds of pull requests from forks hold someone else's code, so only this
      # repository's own builds are kept, named so none passes for a release.
      - name: Save the unsigned development build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astral-index-dev-build-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: src-tauri/target/release/astral-index.exe
          retention-days: 30
          if-no-files-found: error
