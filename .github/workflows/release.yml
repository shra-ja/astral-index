name: Release

# One action releases (decision 0030): started by hand or `gh workflow run
# release.yml`, from main, once every check has passed there. It works out the
# version and notes, builds the release executable on Windows and creates a draft
# release, which the maintainer publishes; publishing creates the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0; worked out from the commits when empty
        required: false
        type: string
      notes:
        description: Notes in Markdown, replacing the generated summary and changes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.write.outputs.version }}
      tag: ${{ steps.write.outputs.tag }}
    steps:
      - name: Release only from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF"
            exit 1
          fi
      # The required checks, as the check workflow names them; the latest run of
      # each from GitHub Actions itself must have passed on this commit.
      - name: Require every check to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: |
            Format, lint, docs and Rust lints
            Tests and 100% coverage
            Mutation probes
            Windows unit tests
            Windows release build
        run: |
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            result=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              -f check_name="$name" \
              --jq '.check_runs | map(select(.app.slug == "github-actions")) | sort_by(.started_at) | last | .conclusion // "missing"')
            if [ "$result" != success ]; then
              echo "::error::$name has not passed on $GITHUB_SHA ($result)"
              exit 1
            fi
          done <<< "$CHECKS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag and merge since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Work out the version and notes
        id: write
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: npm run release:prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: test-results/release/notes.md
          if-no-files-found: error

  build:
    name: Release build
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
      # About shows the version alone for a release build; the smoke test checks
      # the executable carries this version.
      TAURI_CONFIG: '{"version":"${{ needs.prepare.outputs.version }}"}'
      ASTRAL_INDEX_BUILD: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the caches main's checks saved, and saves none of its own.
      - uses: ./.github/actions/setup-windows
        with:
          rust-cache: windows-release
          save-rust-cache: 'false'
      - name: Install the prebuilt notices generator
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-about@0.9.2
      - name: Build the release executable
        run: npm run tauri -- build --no-bundle
      - name: Smoke-test the release executable
        run: npm run test:windows-smoke
      - name: Name the download
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: cp src-tauri/target/release/astral-index.exe "Astral-Index-$TAG.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-executable
          path: Astral-Index-${{ needs.prepare.outputs.tag }}.exe
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      # A draft creates no tag, so the version check in prepare cannot see one;
      # this job can, so it refuses before making a second.
      - name: Refuse a version already drafted or released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          found=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '.[] | select(.tagName == env.TAG) | .tagName')
          if [ -n "$found" ]; then
            echo "::error::A release or draft for $TAG already exists: publish or delete it first"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft
          --title "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
          "Astral-Index-$TAG.exe"
