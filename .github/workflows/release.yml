name: Release

# One action releases (decision 0030): started by hand or `gh workflow run
# release.yml`, from main, once every check has passed there. It works out the
# version and notes, builds the release executable on Windows and creates a draft
# release, which the maintainer publishes; publishing creates the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0; worked out from the commits when empty
        required: false
        type: string
      notes:
        description: Notes in Markdown, replacing the generated summary and changes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.write.outputs.version }}
      tag: ${{ steps.write.outputs.tag }}
    steps:
      - name: Release only from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF"
            exit 1
          fi
      # The check workflow's latest run for the push to main: its result covers every
      # job in it, so no list of checks is kept here, and only GitHub Actions makes runs.
      - name: Require the checks to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml \
            --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[].conclusion')
          if [ "$result" != success ]; then
            echo "::error::The checks have not passed on $GITHUB_SHA (${result:-not run or still running})"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag and merge since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Work out the version and notes
        id: write
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: npm run release:prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: test-results/release/notes.md
          if-no-files-found: error

  build:
    name: Release build
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the caches main's checks saved, and saves none of its own.
      - uses: ./.github/actions/setup-windows
        with:
          rust-cache: windows-release
          save-rust-cache: false
          save-npm-cache: false
      # The same build and smoke test as CI's; About shows the version alone for a
      # release build.
      - uses: ./.github/actions/build-windows
        with:
          version: ${{ needs.prepare.outputs.version }}
          build: release
      - name: Name the download
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: cp src-tauri/target/release/astral-index.exe "Astral-Index-$TAG.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-executable
          path: Astral-Index-${{ needs.prepare.outputs.tag }}.exe
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      # A draft creates no tag, so the version check in prepare cannot see one;
      # this job can, so it refuses before making a second.
      - name: Refuse a version already drafted or released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          found=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '.[] | select(.tagName == env.TAG) | .tagName')
          if [ -n "$found" ]; then
            echo "::error::A release or draft for $TAG already exists: publish or delete it first"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft
          --title "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
          "Astral-Index-$TAG.exe"
