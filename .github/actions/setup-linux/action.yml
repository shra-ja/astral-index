name: Set up the Linux checks
description: >-
  Installs the OS packages, the pinned toolchains from .tool-versions and the
  locked dependencies, restoring the caches main saved. Tool versions live here, so
  changing them invalidates the Rust cache.
inputs:
  rust-cache:
    description: The Rust cache to share; jobs that build the same way share one.
    required: true
  native-tests:
    description: Whether the job runs the instrumented and native tests, which need their tools and network sandbox.
    default: false
  save-rust-cache:
    description: Whether this job saves its Rust cache on main.
    default: false
  save-npm-cache:
    description: Whether this job saves the npm cache on main; one job is enough.
    default: false
  save-apt-cache:
    description: Whether this job saves its OS packages on main; one job per set of packages is enough.
    default: false
runs:
  using: composite
  steps:
    # The OS packages come from a cache main saves, as the Azure mirror is sometimes
    # slow for minutes on end (actions/runner-images#14823). A new runner image or
    # package list starts from the last cache, and apt downloads only what changed,
    # checking every cached package against the signed index.
    - name: Prepare the OS package cache
      id: image
      shell: bash
      # Outside the home folder, which apt's download user can't enter.
      run: |
        sudo install -d -o "$USER" /var/cache/ci-apt-archives
        echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/ci-apt-archives/*.deb
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.native-tests }}-${{ hashFiles('.github/actions/setup-linux/action.yml') }}-${{ steps.image.outputs.version }}
        restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.native-tests }}-
    - name: Install the OS packages
      shell: bash
      env:
        NATIVE_TESTS: ${{ inputs.native-tests }}
      run: |
        packages=(libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev)
        if [[ $NATIVE_TESTS == true ]]; then
          packages+=(xvfb webkit2gtk-driver xdotool dbus-x11 bubblewrap python3)
        fi
        archives=(-o Dir::Cache::Archives=/var/cache/ci-apt-archives)
        # apt moves on from a mirror that stops answering, not from one that crawls,
        # so a slow first attempt drops the Azure mirror and fetches the rest from
        # Ubuntu's own archive.
        if ! { sudo timeout -k 10 60 apt-get update &&
          sudo timeout -k 10 240 apt-get "${archives[@]}" install -y --download-only "${packages[@]}"; }; then
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get "${archives[@]}" install -y --download-only "${packages[@]}"
        fi
        sudo apt-get "${archives[@]}" install -y --no-download "${packages[@]}"
        # The cache keeps only the packages still current.
        sudo apt-get "${archives[@]}" autoclean
    - if: inputs.save-apt-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /var/cache/ci-apt-archives/*.deb
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.native-tests }}-${{ hashFiles('.github/actions/setup-linux/action.yml') }}-${{ steps.image.outputs.version }}
    - name: Allow network namespaces for the CI test sandbox
      if: inputs.native-tests == 'true'
      shell: bash
      run: |
        sudo install -m 0755 /usr/bin/bwrap /usr/local/bin/bwrap
        sudo apparmor_parser -r .github/apparmor-bwrap
        bwrap --unshare-net --dev-bind / / --proc /proc true
    - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      with:
        asdf_version: 0.20.0
      # Rust with only the components the checks use.
      env:
        ASDF_RUST_PROFILE: minimal
    - name: Restore npm downloads
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm/_cacache
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'package-lock.json') }}
    - name: Point Cargo's home at the asdf toolchain
      # asdf keeps installed tools and registry sources here, not in ~/.cargo.
      shell: bash
      run: echo "CARGO_HOME=$(asdf where rust)" >> "$GITHUB_ENV"
    - name: Restore Rust dependencies and installed tools
      # v2.9.2 supports Cargo's new build-dir layout used by the pinned nightly.
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        shared-key: ${{ inputs.rust-cache }}
        key: ${{ hashFiles('.tool-versions', '.github/actions/setup-linux/action.yml') }}
        cache-bin: true
        cache-workspace-crates: false
        # Pull requests restore main's caches; only main saves, so the repository's
        # cache storage holds what every branch can use.
        save-if: ${{ inputs.save-rust-cache == 'true' && github.ref == 'refs/heads/main' }}
    - name: Install Rust components
      shell: bash
      run: rustup component add rustfmt clippy llvm-tools-preview
    - name: Install prebuilt coverage and notices tools
      if: inputs.native-tests == 'true'
      uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      with:
        tool: cargo-llvm-cov@0.9.1,cargo-about@0.9.2
    - name: Install the native test driver
      if: inputs.native-tests == 'true'
      shell: bash
      run: |
        cargo install tauri-driver --version 2.0.6 --locked
        asdf reshim
    - name: Install locked dependencies before network isolation
      shell: bash
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
        cargo fetch --manifest-path src-tauri/Cargo.toml --locked
    - name: Save npm downloads
      if: inputs.save-npm-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm/_cacache
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions', 'package-lock.json') }}
